# ScreenDim-Schreibtisch-Sensor: ESP32-S3 mit Waveshare HMMD mmWave (24 GHz, S3KM1110)
# und VEML7700 (Umgebungslicht, I2C).
#
# Schnittstelle zur App (ScreenDimKit, `SensorProtocol`):
# - mDNS `_screendim._tcp`, TXT `proto=esphome-sse`, `fw=<Version>`; Instanzname gleich
#   Hostname (`screendim-desk-xxxxxx`).
# - Webserver mit Digest-Login, Nutzer `screendim`, Passwort = Kopplungscode.
#   `GET /events` (SSE, Ping alle 10 s), `GET /binary_sensor/Presence`,
#   `GET /sensor/Ambient Light`, `GET /text_sensor/Pairing Code`.
#   Dazu für die Weboberfläche: `sensor/Distance` (Entfernung laut Radar) und
#   `number/Max Distance` (bis dahin zählt jemand als anwesend).
# - BOOT kurz drücken: Kopplungsfenster (2 min, LED pulsiert blau): Der Code ist ohne
#   Login abrufbar; alles andere bleibt hinter dem Login.
#   BOOT 10 s halten: neuer Code, alte Kopplung ungültig, danach Kopplungsfenster.
#
# Bauen und flashen: siehe Firmware/README.md.

substitutions:
  name: screendim-desk
  fw_version: "0.1.0"
  # Verdrahtung HMMD → ESP32-S3
  presence_pin: GPIO4 # OT2: HIGH = anwesend
  radar_rx_pin: GPIO18 # ← TX des Radars
  radar_tx_pin: GPIO17 # → RX des Radars
  # Verdrahtung VEML7700 → ESP32-S3 (I2C, das Modul hat eigene Pull-ups)
  i2c_sda_pin: GPIO8
  i2c_scl_pin: GPIO9
  # RGB-LED (WS2812) der DevKitC-1-Nachbauten; DevKitC-1 v1.1: GPIO38
  led_pin: GPIO48
  # Zusätzlich zur Abfallverzögerung im Radar
  presence_off_delay: 5s
  # Anwesend nur bis zu dieser Entfernung (cm); änderbar in der Weboberfläche
  # („Max Distance“), gemerkt über Neustarts.
  presence_max_distance: "120"
  pairing_window: 2min

esphome:
  name: ${name}
  friendly_name: ScreenDim Sensor
  name_add_mac_suffix: true
  min_version: 2026.10.0
  project:
    name: andreastrabi.screendim-desk
    version: ${fw_version}
  includes:
    - screendim_pairing.h
  on_boot:
    # Nach dem Laden der globals (800), vor WLAN und Webserver (250): Der Platzhalter aus
    # `web_server.auth` gilt nie.
    priority: 600
    then:
      - lambda: |-
          bool fresh = id(code_bits) == 0;
          if (fresh)
            id(code_bits) = screendim::new_code_bits(true);
          id(pairing_code).publish_state(screendim::encode(id(code_bits)));
          screendim::setup_web_auth();
          ESP_LOGI("screendim", "Firmware %s, Kopplungscode %s", "${fw_version}",
                   fresh ? "neu erzeugt" : "geladen");
      # globals schreibt erst `loop()` in den Flash-Puffer; danach sofort sichern.
      - delay: 2s
      - lambda: global_preferences->sync();

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

globals:
  # 40 Bit Kopplungscode; 0 = noch keiner
  - id: code_bits
    type: uint64_t
    restore_value: true
    initial_value: "0"
  # Letzte Textzeilen des Radars (UART, etwa alle 100 ms): „ON“/„OFF“ und „Range <n>“.
  # `…_at`: millis() der letzten solchen Zeile; 0 = noch keine.
  - id: radar_on
    type: bool
    initial_value: "false"
  - id: radar_state_at
    type: uint32_t
    initial_value: "0"
  # Zentimeter: am Schreibtisch 5–80, beim Weggehen bis über 400 (Gates zählten nur 0–15).
  - id: radar_distance
    type: int
    initial_value: "-1"
  - id: radar_distance_at
    type: uint32_t
    initial_value: "0"

wifi:
  # Ohne gespeichertes WLAN: Zugangspunkt `screendim-desk-xxxxxx` mit Captive Portal,
  # alternativ Improv über USB (web.esphome.io).
  ap: {}

captive_portal:

improv_serial:

mdns:
  services:
    - service: _screendim
      protocol: _tcp
      port: 80
      txt:
        proto: esphome-sse
        fw: ${fw_version}

web_server:
  port: 80
  version: 3
  local: true
  # Kein Log per SSE: Die App liest nur `state` und `ping`.
  log: false
  auth:
    type: digest
    username: screendim
    # Platzhalter, gilt nie: on_boot setzt den Kopplungscode, bevor der Webserver startet.
    password: platzhalter

ota:
  # Update über die Weboberfläche, mit Kopplungscode
  - platform: web_server

uart:
  id: radar_uart
  tx_pin: ${radar_tx_pin}
  rx_pin:
    number: ${radar_rx_pin}
    mode:
      input: true
      pullup: true
  baud_rate: 115200
  # Das Radar schreibt Textzeilen „ON“/„OFF“ und „Range <n>“ (laut Waveshare „ON/OFF und
  # Entfernung“, Takt 100 ms). Eine eigene ESPHome-Komponente gibt es nicht; der Debugger
  # liest als einziger Empfänger zeilenweise und wertet aus.
  debug:
    direction: RX
    dummy_receiver: true
    after:
      delimiter: "\n"
      timeout: 20ms
    sequence:
      - lambda: |-
          std::string line(bytes.begin(), bytes.end());
          const char *blank = " \r\n\t";
          line.erase(line.find_last_not_of(blank) + 1);
          line.erase(0, line.find_first_not_of(blank));
          if (line == "ON" || line == "OFF") {
            id(radar_on) = line == "ON";
            id(radar_state_at) = millis();
          } else if (line.rfind("Range ", 0) == 0) {
            char *end = nullptr;
            long cm = strtol(line.c_str() + 6, &end, 10);
            if (end == line.c_str() + 6 || cm < 0) {
              ESP_LOGD("radar", "Unlesbar: %s", line.c_str());
              return;
            }
            id(radar_distance) = (int) cm;
            id(radar_distance_at) = millis();
          } else if (!line.empty()) {
            ESP_LOGD("radar", "Unbekannt: %s", line.c_str());
          }

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}

sensor:
  # Entfernung der Person laut Radar, zum Einstellen von „Max Distance“; leer, wenn das
  # Radar niemanden sieht oder nichts meldet. Die App liest es nicht.
  - platform: template
    id: distance
    name: Distance
    icon: mdi:ruler
    unit_of_measurement: cm
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      uint32_t now = millis();
      bool fresh = id(radar_distance_at) != 0 && now - id(radar_distance_at) <= 1000;
      if (!fresh || !id(radar_on)) return NAN;
      return (float) id(radar_distance);

  # Umgebungslicht. Ohne Modul am Bus meldet ESPHome den Sensor als ausgefallen; die App
  # bekommt dann kein Lux und regelt nicht nach dem Licht, Anwesenheit geht weiter.
  - platform: veml7700
    address: 0x10
    # Verstärkung und Integrationszeit wählt der Treiber selbst (auto_mode).
    update_interval: 2s
    ambient_light:
      name: Ambient Light
      id: ambient_light
      filters:
        # Melden bei 3 % Änderung, sonst alle 30 s als Lebenszeichen: Die App gibt den
        # Sensor nach 45 s ohne Ereignis auf.
        - or:
            - delta: 3%
            - heartbeat: 30s
      # ESPHome loggt Messwerte nur auf VERBOSE; gemeldete Werte hier sichtbar machen.
      on_value:
        - logger.log:
            level: INFO
            tag: screendim
            format: "Licht: %.1f lx"
            args: [x]

number:
  # Bis zu dieser Entfernung zählt jemand als anwesend. Das Radar sieht mit Werkseinstellung
  # mehrere Meter weit; ohne Grenze bliebe „anwesend“, solange man im Raum ist.
  - platform: template
    id: max_distance
    name: Max Distance
    icon: mdi:signal-distance-variant
    unit_of_measurement: cm
    entity_category: config
    mode: box
    min_value: 30
    max_value: 800
    step: 10
    optimistic: true
    restore_value: true
    initial_value: ${presence_max_distance}
    on_value:
      - logger.log:
          level: INFO
          tag: screendim
          format: "Anwesend bis %.0f cm"
          args: [x]

binary_sensor:
  # OT2 des Radars: HIGH = anwesend, mit der Abfallverzögerung des Radars. Gilt nur, wenn
  # der UART schweigt. Ohne Radar bleibt der Eingang HIGH: „anwesend“, die Bildschirme
  # bleiben an.
  - platform: gpio
    id: radar_ot2
    internal: true
    pin:
      number: ${presence_pin}
      mode:
        input: true
        pullup: true

  # Anwesend: Das Radar meldet „ON“, und die Entfernung liegt bis „Max Distance“. Kommt
  # keine Entfernung, gilt „ON“ allein; schweigt der UART (über 1 s), gilt OT2.
  - platform: template
    id: presence
    name: Presence
    device_class: occupancy
    lambda: |-
      uint32_t now = millis();
      bool state_fresh = id(radar_state_at) != 0 && now - id(radar_state_at) <= 1000;
      if (!state_fresh)
        return id(radar_ot2).state;
      if (!id(radar_on))
        return false;
      bool distance_fresh = id(radar_distance_at) != 0 && now - id(radar_distance_at) <= 1000;
      if (!distance_fresh)
        return true;
      return id(radar_distance) <= id(max_distance).state;
    filters:
      - delayed_on: 100ms
      - delayed_off: ${presence_off_delay}
    # ESPHome loggt Zustandswechsel nur auf VERBOSE; den Anfangszustand auch melden
    trigger_on_initial_state: true
    on_state:
      - logger.log:
          level: INFO
          tag: screendim
          format: "Anwesenheit: %s (Radar %s, %d cm, Grenze %.0f cm)"
          args:
            - 'x ? "ja" : "nein"'
            - 'id(radar_on) ? "ON" : "OFF"'
            - id(radar_distance)
            - id(max_distance).state

  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
      mode:
        input: true
        pullup: true
    on_click:
      min_length: 50ms
      max_length: 2s
      then:
        - script.execute: open_pairing
    on_multi_click:
      - timing:
          - ON for at least 10s
        then:
          - script.execute: renew_code

text_sensor:
  - platform: template
    id: pairing_code
    name: Pairing Code
    icon: mdi:key-variant
    entity_category: diagnostic
    update_interval: never

script:
  - id: open_pairing
    mode: restart
    then:
      - lambda: |-
          screendim::set_pairing_open(true);
          ESP_LOGI("screendim", "Kopplungsfenster offen");
      - script.execute: led_pairing
      - delay: ${pairing_window}
      - lambda: |-
          screendim::set_pairing_open(false);
          ESP_LOGI("screendim", "Kopplungsfenster zu");
      - light.turn_off: status_led

  - id: renew_code
    mode: single
    then:
      - lambda: |-
          id(code_bits) = screendim::new_code_bits(false);
          id(pairing_code).publish_state(screendim::encode(id(code_bits)));
          screendim::set_pairing_open(false);
          ESP_LOGW("screendim", "Neuer Kopplungscode, alte Kopplung ungültig");
      - script.execute: led_new_code
      - delay: 2s
      - lambda: global_preferences->sync();
      - script.execute: open_pairing

  # LED-Anzeigen. screendim-desk-xiao.yaml ersetzt beide für die einfarbige LED des XIAO.
  - id: led_pairing
    then:
      - light.turn_on:
          id: status_led
          red: 0%
          green: 20%
          blue: 100%
          brightness: 40%
          effect: Kopplung

  - id: led_new_code
    then:
      - light.turn_on:
          id: status_led
          red: 100%
          green: 0%
          blue: 0%
          brightness: 40%
          effect: Neuer Code

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: ${led_pin}
    num_leds: 1
    chipset: WS2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    effects:
      - pulse:
          name: Kopplung
          transition_length: 500ms
          update_interval: 500ms
      - strobe:
          name: Neuer Code
          colors:
            - state: true
              brightness: 40%
              red: 100%
              green: 0%
              blue: 0%
              duration: 150ms
            - state: false
              duration: 150ms
