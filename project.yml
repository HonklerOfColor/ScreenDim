name: ScreenDim

options:
  bundleIdPrefix: com.andreastrabi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES

targets:
  ScreenDim:
    type: application
    platform: macOS
    sources:
      - path: ScreenDim
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: ScreenDim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Andreas Trabi"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreastrabi.ScreenDim
        PRODUCT_NAME: ScreenDim
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        # Xcode setzt bei Ad-hoc-Signatur ("-") das Runtime-Flag trotz
        # ENABLE_HARDENED_RUNTIME nicht selbst.
        OTHER_CODE_SIGN_FLAGS: "--options=runtime"
        # Die Debug-Dylib (nur für SwiftUI-Previews) scheitert sonst an der
        # Library-Validation der Hardened Runtime ("different Team IDs").
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - sdk: IOKit.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework

  # DDC- und Display-Schicht werden direkt in das Test-Bundle kompiliert. So laufen
  # die Tests ohne Host-App: kein Menüleisten-Start, keine echten I2C-Zugriffe, keine
  # Library-Validation-Probleme mit der Hardened Runtime. Der DisplayManager bekommt in
  # den Tests Discovery und Kanäle von außen.
  ScreenDimTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ScreenDimTests
      - path: ScreenDim/DDC
      - path: ScreenDim/Display
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreastrabi.ScreenDim.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - sdk: IOKit.framework

schemes:
  ScreenDim:
    build:
      targets:
        ScreenDim: all
        ScreenDimTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScreenDimTests
