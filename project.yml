name: ScreenDim

options:
  bundleIdPrefix: com.andreastrabi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: de

# Logik ohne UI und ohne private API; Tests per `swift test` im Paketordner. Der
# I2C-Transport (IOAVService, private API) liegt in der App.
packages:
  ScreenDimKit:
    path: ScreenDimKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Offen: Team-ID und Signatur (Developer ID Application, danach Notarisierung).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode setzt bei Ad-hoc-Signatur ("-") das Runtime-Flag trotz
    # ENABLE_HARDENED_RUNTIME nicht selbst.
    OTHER_CODE_SIGN_FLAGS: "--options=runtime"
    # Die Debug-Dylib (nur für SwiftUI-Previews) scheitert sonst an der
    # Library-Validation der Hardened Runtime ("different Team IDs").
    ENABLE_DEBUG_DYLIB: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  # Developer ID, ohne Sandbox: DDC/CI über IOAVService (private API, im App Store nicht
  # zulässig). Externe Monitore ohne DDC dimmt die App per Software.
  ScreenDim:
    type: application
    platform: macOS
    sources:
      - path: ScreenDim
    dependencies:
      - package: ScreenDimKit
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: ScreenDim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Andreas Trabi"
        # Optionaler Schreibtisch-Sensor im LAN (Bonjour, HTTP an <name>.local).
        # Übersetzung der Begründung: ScreenDim/Resources/InfoPlist.xcstrings
        NSBonjourServices: [_screendim._tcp]
        NSLocalNetworkUsageDescription: "ScreenDim sucht im lokalen Netzwerk nach deinem Schreibtisch-Sensor und verbindet sich nur mit ihm."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreastrabi.ScreenDim
        PRODUCT_NAME: ScreenDim
        ENABLE_APP_SANDBOX: NO

schemes:
  ScreenDim:
    build:
      targets:
        ScreenDim: all
    run:
      config: Debug
    archive:
      config: Release
