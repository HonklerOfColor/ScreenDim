name: ScreenDim

options:
  bundleIdPrefix: com.andreastrabi
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: de

# Logik ohne UI und ohne private API; Tests per `swift test` im Paketordner.
packages:
  ScreenDimKit:
    path: ScreenDimKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Offen: Team-ID und Signatur (App Store: Apple Distribution, Direct: Developer ID).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode setzt bei Ad-hoc-Signatur ("-") das Runtime-Flag trotz
    # ENABLE_HARDENED_RUNTIME nicht selbst.
    OTHER_CODE_SIGN_FLAGS: "--options=runtime"
    # Die Debug-Dylib (nur für SwiftUI-Previews) scheitert sonst an der
    # Library-Validation der Hardened Runtime ("different Team IDs").
    ENABLE_DEBUG_DYLIB: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

# Gemeinsame Basis beider Varianten.
targetTemplates:
  ScreenDimApp:
    type: application
    platform: macOS
    dependencies:
      - package: ScreenDimKit
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework

targets:
  # Mac App Store: Sandbox, keine private API. Die Dateien in ScreenDim/Direct und das
  # Diagnose-Fenster werden nicht kompiliert; externe Monitore dimmt die App per Software.
  # Prüfen: scripts/check-mas-binary.sh <ScreenDim.app>
  ScreenDim:
    templates: [ScreenDimApp]
    sources:
      - path: ScreenDim
        excludes:
          - "Direct/**"
          - "UI/DiagnosticsView.swift"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: ScreenDim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Andreas Trabi"
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: ScreenDim/ScreenDim.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreastrabi.ScreenDim
        PRODUCT_NAME: ScreenDim
        ENABLE_APP_SANDBOX: YES

  # Developer ID: ohne Sandbox, DDC/CI über IOAVService und DisplayServices (private API).
  ScreenDim Direct:
    templates: [ScreenDimApp]
    sources:
      - path: ScreenDim
        excludes:
          - "ScreenDim.entitlements"
    info:
      path: Config/Info-Direct.plist
      properties:
        CFBundleDisplayName: ScreenDim
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Andreas Trabi"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andreastrabi.ScreenDim.direct
        PRODUCT_NAME: ScreenDim Direct
        ENABLE_APP_SANDBOX: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SCREENDIM_DIRECT

schemes:
  ScreenDim:
    build:
      targets:
        ScreenDim: all
    run:
      config: Debug
    archive:
      config: Release
  ScreenDim Direct:
    build:
      targets:
        ScreenDim Direct: all
    run:
      config: Debug
    archive:
      config: Release
